<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏠 Gestione Casa – Samuel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --surface: #FAFAF8; --card: #FFFFFF; --border: #E8E5E0; --text: #1A1A18; --muted: #888880; }
body { font-family: 'DM Sans', sans-serif; background: var(--surface); min-height: 100vh; color: var(--text); }

.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 50; }
.header-title { font-family: 'DM Serif Display', serif; font-size: 20px; }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

.main { max-width: 560px; margin: 0 auto; padding: 20px 16px 110px; }
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.month-title { font-family: 'DM Serif Display', serif; font-size: 22px; }
.btn-nav { background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

.legenda { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; }
.legenda-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
.legenda-item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }
.legenda-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

.week-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
.week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }

.day-card { border-radius: 12px; padding: 10px 5px; cursor: pointer; text-align: center; user-select: none; border: 2px solid transparent; position: relative; min-height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.day-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.day-emoji { font-size: 17px; margin-bottom: 3px; }
.day-line { font-size: 9px; line-height: 1.4; }
.day-cost { margin-top: 5px; font-size: 9px; font-weight: 700; background: white; border-radius: 4px; padding: 1px 5px; display: inline-block; }
.day-note { font-size: 8px; line-height: 1.3; margin-top: 4px; font-style: italic; width: 100%; padding: 0 2px; word-break: break-word; }

.dropdown { position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); z-index: 200; background: white; border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.13); min-width: 260px; overflow: hidden; }
.dropdown-header { padding: 8px 12px; font-size: 10px; font-weight: 700; color: var(--muted); border-bottom: 1px solid #f0f0f0; text-transform: uppercase; letter-spacing: 0.05em; }
.dropdown-item { padding: 10px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f5f5f5; }
.dropdown-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.dropdown-cost { margin-left: auto; font-size: 11px; font-weight: 700; }
.dropdown-divider { padding: 5px 12px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #bbb; background: #fafafa; border-bottom: 1px solid #f0f0f0; }

.riepilogo { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
.riepilogo-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border-radius: 10px; padding: 10px 8px; text-align: center; }
.stat-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.stat-value { font-size: 20px; font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; border: 1px solid; }

.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px 14px; background: var(--surface); border-top: 1px solid var(--border); z-index: 50; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.btn-bottom { padding: 11px 6px; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; border: 1.5px solid var(--border); background: white; color: var(--text); }
.btn-bottom.primary { background: #1a1a18; color: white; border-color: #1a1a18; }
.btn-bottom.green { background: #EAF3DE; color: #3B6D11; border-color: #639922; }

.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: white; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }

/* MODAL SPECIALE */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: flex; align-items: flex-end; justify-content: center; }
.modal-overlay.hidden { display: none; }
.modal { background: white; border-radius: 20px 20px 0 0; padding: 24px 20px 36px; width: 100%; max-width: 560px; }
.modal-title { font-family: 'DM Serif Display', serif; font-size: 18px; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.modal label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; margin-top: 16px; }
.modal textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; resize: none; height: 80px; color: var(--text); }
.modal textarea:focus { outline: none; border-color: #888; }
.cost-options { display: flex; gap: 8px; margin-top: 6px; }
.cost-opt { flex: 1; padding: 10px; border: 1.5px solid var(--border); border-radius: 10px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; }
.cost-opt.selected { background: #1a1a18; color: white; border-color: #1a1a18; }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; }
.btn-modal-cancel { flex: 1; padding: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-modal-save { flex: 2; padding: 13px; background: #1a1a18; color: white; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }

/* PRINT */
@media print {
  body { background: white; }
  .app-view { display: none !important; }
  .print-view { display: block !important; }
  .bottom-bar, .header, .modal-overlay { display: none !important; }
}
.print-view { display: none; }

/* PRINT COMUNE */
.p-page { width: 100%; margin: 0 auto; padding: 10mm 12mm; }
.p-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8mm; border-bottom: 2px solid #f0f0ec; padding-bottom: 6mm; }
.p-title { font-family: 'DM Serif Display', serif; font-size: 26pt; }
.p-sub { font-size: 11pt; color: #888; margin-top: 4px; }
.p-badge { border-radius: 10px; padding: 8px 16px; text-align: center; min-width: 80px; }
.p-badge-label { font-size: 8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.p-badge-value { font-size: 26pt; font-weight: 700; }
.p-badge-sub { font-size: 8pt; margin-top: 2px; }
.p-info { background: #FAFAF8; border: 1px solid #E8E5E0; border-radius: 8px; padding: 8px 14px; margin-bottom: 6mm; display: flex; gap: 20px; flex-wrap: wrap; }
.p-info-item .pi-label { color: #888; font-size: 8pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
.p-info-item .pi-value { font-weight: 600; font-size: 11pt; }
.p-cal-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 4px; }
.p-day-name { text-align: center; font-size: 9pt; font-weight: 700; color: #aaa; text-transform: uppercase; padding: 4px; }
.p-week-block { margin-bottom: 4mm; }
.p-week-label { font-size: 8pt; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 3px; }
.p-week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.p-day { border-radius: 8px; padding: 8px 5px; text-align: center; border: 1.5px solid; min-height: 68px; display: flex; flex-direction: column; justify-content: center; }
.p-day.empty { border: none; background: none; }
.p-day-num { font-size: 16pt; font-weight: 700; margin-bottom: 4px; }
.p-day-tag { font-size: 9pt; font-weight: 600; line-height: 1.4; }
.p-day-note { font-size: 7.5pt; line-height: 1.3; margin-top: 4px; font-style: italic; color: #888; }
.p-totale { border-radius: 10px; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 6mm; }

/* COLORI STAMPA TATA */
.p-day.tata { background: #FEF3E2; border-color: #D97706; }
.p-day.tata .p-day-num, .p-day.tata .p-day-tag { color: #92400E; }
.p-day.tata-full { background: #FDE8F0; border-color: #DB2777; }
.p-day.tata-full .p-day-num, .p-day.tata-full .p-day-tag { color: #9D174D; }
.p-day.free { background: #f8f8f6; border-color: #e8e5e0; }
.p-day.free .p-day-num, .p-day.free .p-day-tag { color: #ccc; }
.p-day.chiusa { background: #F3F4F6; border-color: #9CA3AF; }
.p-day.chiusa .p-day-num, .p-day.chiusa .p-day-tag { color: #6B7280; }
.p-day.chiusa .p-day-note { color: #9CA3AF; }

/* COLORI STAMPA MAMMA */
.p-day.m-bovisio-tu { background: #EAF3DE; border-color: #639922; }
.p-day.m-bovisio-tu .p-day-num, .p-day.m-bovisio-tu .p-day-tag { color: #3B6D11; }
.p-day.m-bovisio-nonno { background: #FEF3E2; border-color: #D97706; }
.p-day.m-bovisio-nonno .p-day-num, .p-day.m-bovisio-nonno .p-day-tag { color: #92400E; }
.p-day.m-monza-tu { background: #E6F1FB; border-color: #378ADD; }
.p-day.m-monza-tu .p-day-num, .p-day.m-monza-tu .p-day-tag { color: #185FA5; }
.p-day.m-monza-nonno { background: #F3E8FF; border-color: #9333EA; }
.p-day.m-monza-nonno .p-day-num, .p-day.m-monza-nonno .p-day-tag { color: #6B21A8; }
.p-day.m-speciale { background: #F3F4F6; border-color: #9CA3AF; }
.p-day.m-speciale .p-day-num, .p-day.m-speciale .p-day-tag { color: #6B7280; }
.p-day.m-speciale .p-day-note { color: #9CA3AF; }
</style>
</head>
<body>

<div class="app-view">
<div class="header">
  <div class="header-title">🏠 Gestione Casa</div>
  <div class="header-sub">Gestione Samuel</div>
</div>

<div class="main">
  <div class="month-nav">
    <button class="btn-nav" onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="btn-nav" onclick="changeMonth(1)">›</button>
  </div>
  <div class="legenda"><div class="legenda-title">Modalità</div><div id="legendaItems"></div></div>
  <div id="calendarGrid"></div>
  <div class="riepilogo">
    <div class="riepilogo-title">Riepilogo Tata Stefania</div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Giorni tata</div><div class="stat-value" id="statGiorni">0</div></div>
      <div class="stat"><div class="stat-label">Giornate €50</div><div class="stat-value" id="statGiornate">0</div></div>
      <div class="stat"><div class="stat-label">Totale mese</div><div class="stat-value" id="statTotale">€0</div></div>
    </div>
    <div class="tags" id="tataTags"></div>
  </div>
</div>

<div class="bottom-bar">
  <button class="btn-bottom" onclick="stampaTata()">🖨️ Stampa<br/>Tata</button>
  <button class="btn-bottom primary" onclick="stampaMamma()">🖨️ Stampa<br/>Mia</button>
  <button class="btn-bottom green" onclick="esportaICS()">📅 Esporta<br/>Calendar</button>
</div>
</div>

<!-- MODAL GIORNO SPECIALE -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Giorno speciale</div>
    <div class="modal-sub">Scuola chiusa o orario modificato</div>
    <label>Chi gestisce Samuel?</label>
    <textarea id="modalNote" placeholder="es. Nonna 8:00-13:00, Nonno 13:00-18:00&#10;oppure: Nonno mattina, Tata Stefania 14:00-19:00"></textarea>
    <label>Costo tata</label>
    <div class="cost-options">
      <div class="cost-opt selected" id="cost0" onclick="selectCost(0)">€0</div>
      <div class="cost-opt" id="cost15" onclick="selectCost(15)">€15</div>
      <div class="cost-opt" id="cost50" onclick="selectCost(50)">€50</div>
    </div>
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-modal-save" onclick="saveSpecial()">Salva</button>
    </div>
  </div>
</div>

<div class="print-view" id="printView"></div>
<div class="toast" id="toast"></div>

<script>
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GG = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const STORAGE_KEY = 'gestione_casa_v2';

const MODALITA = [
  { id:'bovisio_nonno_tu',   label:'Bovisio – Nonno porta, tu prendi',   emoji:'🏥', breve:['Nonno porta','Tu 17:15'],    tariffa:0,  color:{bg:'#EAF3DE',border:'#639922',text:'#3B6D11'} },
  { id:'bovisio_nonno_tata', label:'Bovisio – Nonno porta, Tata prende', emoji:'🏥', breve:['Nonno porta','Tata 17:15'],  tariffa:15, color:{bg:'#FEF3E2',border:'#D97706',text:'#92400E'} },
  { id:'bovisio_tu_tata',    label:'Bovisio – Tu porti, Tata prende',    emoji:'🏥', breve:['Tu porti','Tata 17:15'],    tariffa:15, color:{bg:'#FDE8F0',border:'#DB2777',text:'#9D174D'} },
  { id:'monza_tu_tata',      label:'Monza – Tu porti, Tata prende',      emoji:'🏢', breve:['Tu porti','Tata 17:15'],    tariffa:15, color:{bg:'#E6F1FB',border:'#378ADD',text:'#185FA5'} },
  { id:'monza_nonno_tata',   label:'Monza – Nonno porta, Tata prende',   emoji:'🏢', breve:['Nonno porta','Tata 17:15'], tariffa:15, color:{bg:'#F3E8FF',border:'#9333EA',text:'#6B21A8'} },
  { id:'speciale',           label:'Scuola chiusa / Orario modificato',  emoji:'📝', breve:['Gestione','personalizzata'], tariffa:0,  color:{bg:'#F3F4F6',border:'#9CA3AF',text:'#374151'} },
];

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let openDay = null;
let modalDate = null;
let modalCost = 0;

function loadSchedule(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; }catch(e){ return {}; } }
function saveSchedule(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(schedule)); }catch(e){} }
let schedule = loadSchedule();

function getWorkdays(y,m){ const days=[],d=new Date(y,m,1); while(d.getMonth()===m){ if(d.getDay()!==0&&d.getDay()!==6) days.push(new Date(d)); d.setDate(d.getDate()+1); } return days; }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function changeMonth(delta){ currentMonth+=delta; if(currentMonth>11){currentMonth=0;currentYear++;} if(currentMonth<0){currentMonth=11;currentYear--;} render(); }
function getDayData(date){ return schedule[date]||{id:'monza_tu_tata',note:'',tariffa:15}; }
function getMod(id){ return MODALITA.find(m=>m.id===id)||MODALITA[3]; }

function setMod(date,id){
  if(id==='speciale'){ openDay=null; render(); openModal(date); return; }
  const mod=getMod(id);
  schedule[date]={id,note:'',tariffa:mod.tariffa};
  saveSchedule(); openDay=null; render();
}
function toggleDay(date){ openDay=openDay===date?null:date; render(); }

function openModal(date){
  modalDate=date;
  const d=new Date(date); const ex=schedule[date];
  document.getElementById('modalTitle').textContent=`📝 ${GG[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;
  document.getElementById('modalNote').value=ex?.id==='speciale'?(ex.note||''):'';
  selectCost(ex?.id==='speciale'?(ex.tariffa||0):0);
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modalOverlay').classList.add('hidden'); modalDate=null; }
function selectCost(val){ modalCost=val; [0,15,50].forEach(v=>document.getElementById('cost'+v).classList.toggle('selected',v===val)); }
function saveSpecial(){ const note=document.getElementById('modalNote').value.trim(); schedule[modalDate]={id:'speciale',note,tariffa:modalCost}; saveSchedule(); closeModal(); render(); }

function render(){
  const workdays=getWorkdays(currentYear,currentMonth);
  document.getElementById('monthTitle').textContent=`${MESI[currentMonth]} ${currentYear}`;
  document.getElementById('legendaItems').innerHTML=MODALITA.map(m=>
    `<div class="legenda-item"><div class="legenda-dot" style="background:${m.color.bg};border:1.5px solid ${m.color.border}"></div>
    <span style="color:${m.color.text};font-weight:600">${m.emoji} ${m.label}</span>
    ${m.tariffa>0?`<span style="margin-left:auto;color:#aaa;font-size:11px">€${m.tariffa}</span>`:''}</div>`).join('');

  const weeks=[]; let week=[];
  workdays.forEach(d=>{ week.push(d); if(d.getDay()===5||d===workdays[workdays.length-1]){weeks.push([...week]);week=[];} });

  const grid=document.getElementById('calendarGrid'); grid.innerHTML='';
  weeks.forEach(wk=>{
    const lbl=document.createElement('div'); lbl.className='week-label';
    lbl.textContent=`${wk[0].getDate()}–${wk[wk.length-1].getDate()} ${MESI[currentMonth].slice(0,3).toLowerCase()}`;
    grid.appendChild(lbl);
    const wg=document.createElement('div'); wg.className='week-grid';
    wk.forEach(d=>{
      const key=dateKey(d),data=getDayData(key),mod=getMod(data.id),c=mod.color,isOpen=openDay===key;
      const card=document.createElement('div');
      card.className='day-card'; card.style.cssText=`background:${c.bg};border-color:${isOpen?c.text:c.border}`;
      card.onclick=(e)=>{e.stopPropagation();toggleDay(key);};
      card.innerHTML=`<div class="day-name" style="color:${c.text}">${GG[d.getDay()]} ${d.getDate()}</div>
        <div class="day-emoji">${mod.emoji}</div>
        <div class="day-line" style="color:${c.text}">${mod.breve[0]}</div>
        <div class="day-line" style="color:${c.text}">${mod.breve[1]}</div>
        ${data.tariffa>0?`<div class="day-cost" style="color:${c.text}">€${data.tariffa}</div>`:''}
        ${data.id==='speciale'&&data.note?`<div class="day-note" style="color:${c.text}">${data.note}</div>`:''}`;
      if(isOpen){
        const drop=document.createElement('div'); drop.className='dropdown';
        drop.innerHTML=`<div class="dropdown-header">${GG[d.getDay()]} ${d.getDate()} – Modalità</div>
          <div class="dropdown-divider">Standard</div>`+
          MODALITA.filter(m=>m.id!=='speciale').map(m=>`
            <div class="dropdown-item" style="${data.id===m.id?`background:${m.color.bg};color:${m.color.text};font-weight:700`:''}"
              onclick="event.stopPropagation();setMod('${key}','${m.id}')">
              <div class="dropdown-dot" style="background:${m.color.bg};border:1.5px solid ${m.color.border}"></div>
              ${m.emoji} ${m.label}
              ${m.tariffa>0?`<span class="dropdown-cost" style="color:${m.color.text}">€${m.tariffa}</span>`:''}
            </div>`).join('')+
          `<div class="dropdown-divider">Speciali</div>
          <div class="dropdown-item" style="${data.id==='speciale'?'background:#F3F4F6;color:#374151;font-weight:700':''}"
            onclick="event.stopPropagation();setMod('${key}','speciale')">
            <div class="dropdown-dot" style="background:#F3F4F6;border:1.5px solid #9CA3AF"></div>
            📝 Scuola chiusa / Orario modificato
          </div>`;
        card.appendChild(drop);
      }
      wg.appendChild(card);
    });
    grid.appendChild(wg);
  });

  const tataDays=workdays.filter(d=>getDayData(dateKey(d)).tariffa>0);
  const giornate50=workdays.filter(d=>getDayData(dateKey(d)).tariffa===50).length;
  const totale=workdays.reduce((sum,d)=>sum+(getDayData(dateKey(d)).tariffa||0),0);
  document.getElementById('statGiorni').textContent=tataDays.length;
  document.getElementById('statGiornate').textContent=giornate50;
  document.getElementById('statTotale').textContent=`€${totale}`;
  document.getElementById('tataTags').innerHTML=tataDays.map(d=>{
    const data=getDayData(dateKey(d)),mod=getMod(data.id);
    return `<span class="tag" style="background:${mod.color.bg};color:${mod.color.text};border-color:${mod.color.border}">${GG[d.getDay()]} ${d.getDate()}${data.tariffa===50?' 💶':''}</span>`;
  }).join('');
}

// ── STAMPA TATA ──
function buildWeeksHTML(workdays, cellFn){
  const weeks=[]; let week=[];
  workdays.forEach(d=>{ week.push(d); if(d.getDay()===5||d===workdays[workdays.length-1]){weeks.push([...week]);week=[];} });
  return weeks.map(wk=>{
    const firstDow=wk[0].getDay(); let cells='';
    for(let i=1;i<firstDow;i++) cells+=`<div class="p-day empty"></div>`;
    wk.forEach(d=>{ cells+=cellFn(d); });
    return `<div class="p-week-block"><div class="p-week-label">${wk[0].getDate()}–${wk[wk.length-1].getDate()} ${MESI[currentMonth].slice(0,3).toLowerCase()}</div><div class="p-week-grid">${cells}</div></div>`;
  }).join('');
}

function stampaTata(){
  const workdays=getWorkdays(currentYear,currentMonth);
  const tataDays=workdays.filter(d=>getDayData(dateKey(d)).tariffa>0);
  const weeksHTML=buildWeeksHTML(workdays,d=>{
    const key=dateKey(d),data=getDayData(key);
    if(data.id==='speciale') return `<div class="p-day chiusa"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Giorno<br/>speciale</div>${data.note?`<div class="p-day-note">${data.note}</div>`:''}</div>`;
    if(data.tariffa===50) return `<div class="p-day tata-full"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Tata Stefania<br/>giornata</div></div>`;
    if(data.tariffa===15){ const sede=data.id.startsWith('bovisio')?'Bovisio':'Monza'; return `<div class="p-day tata"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">${sede}<br/>Tata Stefania</div></div>`; }
    return `<div class="p-day free"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Giorno<br/>libero</div></div>`;
  });
  document.getElementById('printView').innerHTML=`<div class="p-page">
    <div class="p-header">
      <div><div class="p-title">📅 Calendario Tata Stefania</div><div class="p-sub">${MESI[currentMonth]} ${currentYear} · Samuel</div><div class="p-sub">Orario standard: 17:15 – 18:30</div></div>
      <div class="p-badge" style="background:#FEF3E2;border:1.5px solid #D97706"><div class="p-badge-label" style="color:#92400E">Uscite mese</div><div class="p-badge-value" style="color:#92400E">${tataDays.length}</div><div class="p-badge-sub" style="color:#D97706">giorni con Samuel</div></div>
    </div>
    <div class="p-info">
      <div class="p-info-item"><div class="pi-label">Bambino</div><div class="pi-value">Samuel</div></div>
      <div class="p-info-item"><div class="pi-label">Ritiro</div><div class="pi-value">17:15</div></div>
      <div class="p-info-item"><div class="pi-label">Fine</div><div class="pi-value">18:30</div></div>
      <div class="p-info-item"><div class="pi-label">Mese</div><div class="pi-value">${MESI[currentMonth]} ${currentYear}</div></div>
    </div>
    <div class="p-cal-header"><div class="p-day-name">Lun</div><div class="p-day-name">Mar</div><div class="p-day-name">Mer</div><div class="p-day-name">Gio</div><div class="p-day-name">Ven</div></div>
    ${weeksHTML}
    <div class="p-totale" style="background:#1a1a18;color:white">
      <div><div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:4px">Totale uscite ${MESI[currentMonth]}</div><div style="font-size:24px;font-weight:700">${tataDays.length} giorni</div></div>
      <div style="text-align:right"><div style="font-size:12px;color:rgba(255,255,255,0.5)">Standard: 17:15–18:30</div><div style="font-size:12px;color:rgba(255,255,255,0.5)">Giornata intera: €50</div></div>
    </div>
  </div>`;
  window.print();
}

// ── STAMPA MAMMA ──
function stampaMamma(){
  const workdays=getWorkdays(currentYear,currentMonth);
  const weeksHTML=buildWeeksHTML(workdays,d=>{
    const key=dateKey(d),data=getDayData(key);
    if(data.id==='speciale') return `<div class="p-day m-speciale"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Giorno<br/>speciale</div>${data.note?`<div class="p-day-note">${data.note}</div>`:''}</div>`;
    if(data.id==='bovisio_nonno_tu') return `<div class="p-day m-bovisio-nonno"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Bovisio<br/>Nonno porta<br/>Tu 17:15</div></div>`;
    if(data.id==='bovisio_nonno_tata') return `<div class="p-day m-bovisio-nonno"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Bovisio<br/>Nonno porta<br/>Tata 17:15</div></div>`;
    if(data.id==='bovisio_tu_tata') return `<div class="p-day m-bovisio-tu"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Bovisio<br/>Tu porti<br/>Tata 17:15</div></div>`;
    if(data.id==='monza_tu_tata') return `<div class="p-day m-monza-tu"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Monza<br/>Tu porti<br/>Tata 17:15</div></div>`;
    if(data.id==='monza_nonno_tata') return `<div class="p-day m-monza-nonno"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Monza<br/>Nonno porta<br/>Tata 17:15</div></div>`;
    return `<div class="p-day m-speciale"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">—</div></div>`;

  // Legenda colori per stampa mamma

    <div style="display:flex;align-items:center;gap:6px;font-size:11px"><div style="width:12px;height:12px;border-radius:3px;background:#FEF3E2;border:1.5px solid #D97706"></div><span style="color:#92400E;font-weight:600">Bovisio – Nonno porta</span></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px"><div style="width:12px;height:12px;border-radius:3px;background:#E6F1FB;border:1.5px solid #378ADD"></div><span style="color:#185FA5;font-weight:600">Monza – Tu porti</span></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px"><div style="width:12px;height:12px;border-radius:3px;background:#F3E8FF;border:1.5px solid #9333EA"></div><span style="color:#6B21A8;font-weight:600">Monza – Nonno porta</span></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px"><div style="width:12px;height:12px;border-radius:3px;background:#F3F4F6;border:1.5px solid #9CA3AF"></div><span style="color:#6B7280;font-weight:600">Giorno speciale</span></div>
  </div>`;

  document.getElementById('printView').innerHTML=`<div class="p-page">
    <div class="p-header">
      <div><div class="p-title">🏠 Calendario Mamma</div><div class="p-sub">${MESI[currentMonth]} ${currentYear} · Samuel</div><div class="p-sub">Quadro generale gestione giornaliera</div></div>
      <div class="p-badge" style="background:#E6F1FB;border:1.5px solid #378ADD"><div class="p-badge-label" style="color:#185FA5">Giorni lav.</div><div class="p-badge-value" style="color:#185FA5">${getWorkdays(currentYear,currentMonth).length}</div><div class="p-badge-sub" style="color:#378ADD">${MESI[currentMonth]} ${currentYear}</div></div>
    </div>
    ${legenda}
    <div class="p-cal-header"><div class="p-day-name">Lun</div><div class="p-day-name">Mar</div><div class="p-day-name">Mer</div><div class="p-day-name">Gio</div><div class="p-day-name">Ven</div></div>
    ${weeksHTML}
  </div>`;
  window.print();
}

// ── ESPORTA ICS ──
function esportaICS(){
  const workdays=getWorkdays(currentYear,currentMonth);
  let ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Gestione Casa Samuel//IT\r\nCALSCALE:GREGORIAN\r\n`;

  workdays.forEach(d=>{
    const key=dateKey(d),data=getDayData(key);
    if(data.id==='speciale'&&!data.note) return;
    const ds=key.replace(/-/g,'');
    const uid=`${ds}-${Math.random().toString(36).slice(2)}@gestione-casa`;

    if(data.id==='speciale'){
      ics+=`BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTART:${ds}T080000\r\nDTEND:${ds}T183000\r\nSUMMARY:📝 Samuel – ${data.note.slice(0,50)}\r\nDESCRIPTION:${data.note}\r\nEND:VEVENT\r\n`;
      return;
    }
    const isBovisio=data.id.startsWith('bovisio');
    const sh=isBovisio?'070000':'083000'; const eh=isBovisio?'083000':'173000';
    let sum;
    if(data.id==='bovisio_nonno_tu'||data.id==='bovisio_nonno_tata') sum='🏥 Studio Bovisio – Nonno porta Samuel';
    else if(data.id==='bovisio_tu_tata') sum='🏥 Bovisio – Tu porti Samuel';
    else if(data.id==='monza_tu_tata') sum='🏢 Monza – Tu porti Samuel';
    else sum='🏢 Monza – Nonno porta Samuel';
    ics+=`BEGIN:VEVENT\r\nUID:${uid}a\r\nDTSTART:${ds}T${sh}\r\nDTEND:${ds}T${eh}\r\nSUMMARY:${sum}\r\nEND:VEVENT\r\n`;

    if(data.tariffa===0){
      ics+=`BEGIN:VEVENT\r\nUID:${uid}b\r\nDTSTART:${ds}T171500\r\nDTEND:${ds}T173000\r\nSUMMARY:⏰ Prendi Samuel 17:15 – tu\r\nEND:VEVENT\r\n`;
    } else {
      const ts=data.tariffa===50?'👩 Tata Stefania – giornata intera':'👩 Tata Stefania con Samuel 17:15–18:30';
      ics+=`BEGIN:VEVENT\r\nUID:${uid}b\r\nDTSTART:${ds}T171500\r\nDTEND:${ds}T183000\r\nSUMMARY:${ts}\r\nEND:VEVENT\r\n`;
    }
  });

  ics+=`END:VCALENDAR`;
  const blob=new Blob([ics],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`samuel-${MESI[currentMonth].toLowerCase()}-${currentYear}.ics`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`📅 File .ics scaricato!`);
}

window.onload=()=>{ render(); document.addEventListener('click',()=>{openDay=null;render();}); document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();}); };
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
