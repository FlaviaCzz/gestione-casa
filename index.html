<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏠 Gestione Casa – Samuel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --surface: #FAFAF8; --card: #FFFFFF; --border: #E8E5E0;
  --text: #1A1A18; --muted: #888880;
}
body { font-family: 'DM Sans', sans-serif; background: var(--surface); min-height: 100vh; color: var(--text); }

/* HEADER */
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.header-title { font-family: 'DM Serif Display', serif; font-size: 20px; }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* AUTH */
.btn-google { display: flex; align-items: center; gap: 8px; background: white; border: 1.5px solid var(--border); border-radius: 20px; padding: 7px 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text); }
.user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.user-info img { width: 28px; height: 28px; border-radius: 50%; }
.btn-logout { background: none; border: none; font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline; }

/* MAIN */
.main { max-width: 560px; margin: 0 auto; padding: 20px 16px 100px; }

/* MONTH NAV */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.month-title { font-family: 'DM Serif Display', serif; font-size: 22px; }
.btn-nav { background: var(--card); border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }

/* LEGENDA */
.legenda { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; }
.legenda-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
.legenda-item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }
.legenda-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

/* WEEK */
.week-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
.week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }

/* DAY CARD */
.day-card { border-radius: 12px; padding: 9px 5px; cursor: pointer; text-align: center; user-select: none; border: 2px solid transparent; position: relative; }
.day-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.day-emoji { font-size: 17px; margin-bottom: 3px; }
.day-line { font-size: 9px; line-height: 1.4; }
.day-cost { margin-top: 5px; font-size: 9px; font-weight: 700; background: white; border-radius: 4px; padding: 1px 5px; display: inline-block; }

/* DROPDOWN */
.dropdown { position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); z-index: 200; background: white; border: 1px solid #ddd; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.13); min-width: 255px; overflow: hidden; }
.dropdown-header { padding: 8px 12px; font-size: 10px; font-weight: 700; color: var(--muted); border-bottom: 1px solid #f0f0f0; text-transform: uppercase; letter-spacing: 0.05em; }
.dropdown-item { padding: 10px 12px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f5f5f5; }
.dropdown-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.dropdown-cost { margin-left: auto; font-size: 11px; font-weight: 700; }

/* RIEPILOGO */
.riepilogo { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
.riepilogo-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border-radius: 10px; padding: 10px 8px; text-align: center; }
.stat-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.stat-value { font-size: 20px; font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; border: 1px solid; }

/* BOTTOM BUTTONS */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); z-index: 50; display: flex; gap: 8px; }
.btn-publish { flex: 1; padding: 14px; background: #1a1a18; color: white; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-publish:disabled { background: #ccc; cursor: not-allowed; }
.btn-publish.success { background: #3B6D11; }
.btn-stampa { padding: 14px 16px; background: white; color: #1a1a18; border: 1.5px solid var(--border); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }

/* TOAST */
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: white; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }

.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════
   PRINT STYLES
═══════════════════════════════════ */
@media print {
  body { background: white; }
  .app-view { display: none !important; }
  .print-view { display: block !important; }
  .bottom-bar { display: none !important; }
  .header { display: none !important; }
}

.print-view { display: none; max-width: 680px; margin: 0 auto; padding: 28px 24px; }
.print-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 2px solid #f0f0ec; padding-bottom: 18px; }
.print-title { font-family: 'DM Serif Display', serif; font-size: 24px; }
.print-sub { font-size: 13px; color: #888; margin-top: 4px; }
.print-badge { background: #FEF3E2; border: 1.5px solid #D97706; border-radius: 10px; padding: 10px 16px; text-align: center; }
.print-badge-label { font-size: 10px; color: #92400E; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.print-badge-value { font-size: 22px; font-weight: 700; color: #92400E; }
.print-badge-sub { font-size: 10px; color: #D97706; margin-top: 2px; }
.print-info { background: #FAFAF8; border: 1px solid #E8E5E0; border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; display: flex; gap: 24px; flex-wrap: wrap; }
.print-info-item .pi-label { color: #888; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
.print-info-item .pi-value { font-weight: 600; font-size: 13px; }
.p-cal-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }
.p-day-name { text-align: center; font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; padding: 4px; }
.p-week-block { margin-bottom: 12px; }
.p-week-label { font-size: 10px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.p-week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.p-day { border-radius: 10px; padding: 10px 6px; text-align: center; border: 1.5px solid; }
.p-day.tata { background: #FEF3E2; border-color: #D97706; }
.p-day.free { background: #f8f8f6; border-color: #e8e5e0; }
.p-day.empty { border: none; background: none; }
.p-day-num { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.p-day.tata .p-day-num { color: #92400E; }
.p-day.free .p-day-num { color: #ccc; }
.p-day-tag { font-size: 9px; font-weight: 600; line-height: 1.4; }
.p-day.tata .p-day-tag { color: #92400E; }
.p-day.free .p-day-tag { color: #ccc; }
.print-totale { background: #1a1a18; color: white; border-radius: 12px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
.pt-label { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
.pt-value { font-size: 24px; font-weight: 700; }
.pt-detail { font-size: 12px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<!-- ═══ APP VIEW ═══ -->
<div class="app-view">
<div class="header">
  <div>
    <div class="header-title">🏠 Gestione Casa</div>
    <div class="header-sub">Samuel · Calendario automatico</div>
  </div>
  <div id="authArea">
    <button class="btn-google" onclick="signIn()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" alt="G"/>
      Accedi con Google
    </button>
  </div>
</div>

<div class="main">
  <div class="month-nav">
    <button class="btn-nav" onclick="changeMonth(-1)">‹</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="btn-nav" onclick="changeMonth(1)">›</button>
  </div>
  <div class="legenda"><div class="legenda-title">Modalità</div><div id="legendaItems"></div></div>
  <div id="calendarGrid"></div>
  <div class="riepilogo">
    <div class="riepilogo-title">Riepilogo Tata Stefania</div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Giorni tata</div><div class="stat-value" id="statGiorni">0</div></div>
      <div class="stat"><div class="stat-label">A uscita</div><div class="stat-value">€15</div></div>
      <div class="stat"><div class="stat-label">Totale mese</div><div class="stat-value" id="statTotale">€0</div></div>
    </div>
    <div class="tags" id="tataTags"></div>
  </div>
</div>

<div class="bottom-bar">
  <button class="btn-stampa" onclick="stampaPDF()">🖨️ Stampa</button>
  <button class="btn-publish" id="btnPublish" onclick="publishToCalendar()" disabled>
    🔒 Accedi per pubblicare
  </button>
</div>
</div>

<!-- ═══ PRINT VIEW ═══ -->
<div class="print-view" id="printView"></div>

<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID = '638641620939-dajtsen2bmuuavurafn15gm3o70du4u6.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
const TATA_COSTO = 15;
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GG = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

const MODALITA = [
  { id: 'bovisio_nonno_tu',   label: 'Bovisio – Nonno porta, tu prendi',   emoji: '🏥', breve: ['Nonno porta','Tu 17:15'],    tata: false, color: { bg: '#EAF3DE', border: '#639922', text: '#3B6D11' } },
  { id: 'bovisio_nonno_tata', label: 'Bovisio – Nonno porta, Tata prende', emoji: '🏥', breve: ['Nonno porta','Tata 17:15'],  tata: true,  color: { bg: '#FEF3E2', border: '#D97706', text: '#92400E' } },
  { id: 'bovisio_tu_tata',    label: 'Bovisio – Tu porti, Tata prende',    emoji: '🏥', breve: ['Tu porti','Tata 17:15'],    tata: true,  color: { bg: '#FDE8F0', border: '#DB2777', text: '#9D174D' } },
  { id: 'monza_tu_tata',      label: 'Monza – Tu porti, Tata prende',      emoji: '🏢', breve: ['Tu porti','Tata 17:15'],    tata: true,  color: { bg: '#E6F1FB', border: '#378ADD', text: '#185FA5' } },
  { id: 'monza_nonno_tata',   label: 'Monza – Nonno porta, Tata prende',   emoji: '🏢', breve: ['Nonno porta','Tata 17:15'], tata: true,  color: { bg: '#F3E8FF', border: '#9333EA', text: '#6B21A8' } },
];

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let schedule = {};
let openDay = null;
let accessToken = null;

function getWorkdays(y, m) {
  const days = []; const d = new Date(y, m, 1);
  while (d.getMonth() === m) { const dow = d.getDay(); if (dow !== 0 && dow !== 6) days.push(new Date(d)); d.setDate(d.getDate()+1); }
  return days;
}
function dateKey(d) { return d.toISOString().slice(0,10); }
function changeMonth(delta) { currentMonth += delta; if (currentMonth>11){currentMonth=0;currentYear++;} if (currentMonth<0){currentMonth=11;currentYear--;} render(); }
function getMod(date) { return MODALITA.find(m => m.id === (schedule[date]||'monza_tu_tata')); }
function setMod(date, id) { schedule[date]=id; openDay=null; render(); }
function toggleDay(date) { openDay = openDay===date ? null : date; render(); }

function render() {
  const workdays = getWorkdays(currentYear, currentMonth);
  document.getElementById('monthTitle').textContent = `${MESI[currentMonth]} ${currentYear}`;

  document.getElementById('legendaItems').innerHTML = MODALITA.map(m =>
    `<div class="legenda-item">
      <div class="legenda-dot" style="background:${m.color.bg};border:1.5px solid ${m.color.border}"></div>
      <span style="color:${m.color.text};font-weight:600">${m.emoji} ${m.label}</span>
      ${m.tata ? `<span style="margin-left:auto;color:#aaa;font-size:11px">€15</span>` : ''}
    </div>`).join('');

  // Group into weeks
  const weeks = []; let week = [];
  workdays.forEach(d => {
    week.push(d);
    if (d.getDay()===5 || d===workdays[workdays.length-1]) { weeks.push([...week]); week=[]; }
  });

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  weeks.forEach(wk => {
    const lbl = document.createElement('div'); lbl.className='week-label';
    lbl.textContent = `${wk[0].getDate()}–${wk[wk.length-1].getDate()} ${MESI[currentMonth].slice(0,3).toLowerCase()}`;
    grid.appendChild(lbl);
    const wg = document.createElement('div'); wg.className='week-grid';
    wk.forEach(d => {
      const key = dateKey(d); const mod = getMod(key); const c = mod.color; const isOpen = openDay===key;
      const card = document.createElement('div');
      card.className='day-card'+(isOpen?' open':'');
      card.style.cssText=`background:${c.bg};border-color:${isOpen?c.text:c.border}`;
      card.onclick=(e)=>{e.stopPropagation();toggleDay(key);};
      card.innerHTML=`
        <div class="day-name" style="color:${c.text}">${GG[d.getDay()]} ${d.getDate()}</div>
        <div class="day-emoji">${mod.emoji}</div>
        <div class="day-line" style="color:${c.text}">${mod.breve[0]}</div>
        <div class="day-line" style="color:${c.text}">${mod.breve[1]}</div>
        ${mod.tata?`<div class="day-cost" style="color:${c.text}">€15</div>`:''}`;
      if (isOpen) {
        const drop=document.createElement('div'); drop.className='dropdown';
        drop.innerHTML=`<div class="dropdown-header">${GG[d.getDay()]} ${d.getDate()} – Scegli modalità</div>`+
          MODALITA.map(m=>`<div class="dropdown-item" style="${schedule[key]===m.id?`background:${m.color.bg};color:${m.color.text};font-weight:600`:''}"
            onclick="event.stopPropagation();setMod('${key}','${m.id}')">
            <div class="dropdown-dot" style="background:${m.color.bg};border:1.5px solid ${m.color.border}"></div>
            ${m.emoji} ${m.label}
            ${m.tata?`<span class="dropdown-cost" style="color:${m.color.text}">€15</span>`:''}
          </div>`).join('');
        card.appendChild(drop);
      }
      wg.appendChild(card);
    });
    grid.appendChild(wg);
  });

  const tataDays = workdays.filter(d=>getMod(dateKey(d)).tata);
  document.getElementById('statGiorni').textContent = tataDays.length;
  document.getElementById('statTotale').textContent = `€${tataDays.length*TATA_COSTO}`;
  document.getElementById('tataTags').innerHTML = tataDays.map(d=>{
    const mod=getMod(dateKey(d));
    return `<span class="tag" style="background:${mod.color.bg};color:${mod.color.text};border-color:${mod.color.border}">${GG[d.getDay()]} ${d.getDate()}</span>`;
  }).join('');
}

// ─── STAMPA ─────────────────────────────────────────
function stampaPDF() {
  const workdays = getWorkdays(currentYear, currentMonth);
  const tataDays = workdays.filter(d => getMod(dateKey(d)).tata);

  // Group into weeks
  const weeks = []; let week = [];
  workdays.forEach(d => {
    week.push(d);
    if (d.getDay()===5 || d===workdays[workdays.length-1]) { weeks.push([...week]); week=[]; }
  });

  // Build weeks HTML
  let weeksHTML = '';
  weeks.forEach(wk => {
    const firstDow = wk[0].getDay(); // 1=Lun
    let cells = '';
    // empty cells before first day
    for (let i=1; i<firstDow; i++) cells += `<div class="p-day empty"></div>`;
    wk.forEach(d => {
      const key = dateKey(d); const mod = getMod(key);
      if (mod.tata) {
        const sede = mod.id.startsWith('bovisio') ? 'Bovisio' : 'Monza';
        cells += `<div class="p-day tata"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">${sede}<br/>Tata Stefania</div></div>`;
      } else {
        cells += `<div class="p-day free"><div class="p-day-num">${d.getDate()}</div><div class="p-day-tag">Giorno<br/>libero</div></div>`;
      }
    });
    weeksHTML += `
      <div class="p-week-block">
        <div class="p-week-label">${wk[0].getDate()}–${wk[wk.length-1].getDate()} ${MESI[currentMonth].slice(0,3).toLowerCase()}</div>
        <div class="p-week-grid">${cells}</div>
      </div>`;
  });

  document.getElementById('printView').innerHTML = `
    <div class="print-header">
      <div>
        <div class="print-title">📅 Calendario Tata Stefania</div>
        <div class="print-sub">${MESI[currentMonth]} ${currentYear} · Samuel</div>
        <div class="print-sub">Orario: 17:15 – 18:30</div>
      </div>
      <div class="print-badge">
        <div class="print-badge-label">Uscite mese</div>
        <div class="print-badge-value">${tataDays.length}</div>
        <div class="print-badge-sub">giorni con Samuel</div>
      </div>
    </div>
    <div class="print-info">
      <div class="print-info-item"><div class="pi-label">Bambino</div><div class="pi-value">Samuel</div></div>
      <div class="print-info-item"><div class="pi-label">Ritiro</div><div class="pi-value">17:15</div></div>
      <div class="print-info-item"><div class="pi-label">Fine servizio</div><div class="pi-value">18:30</div></div>
      <div class="print-info-item"><div class="pi-label">Mese</div><div class="pi-value">${MESI[currentMonth]} ${currentYear}</div></div>
    </div>
    <div class="p-cal-header">
      <div class="p-day-name">Lun</div><div class="p-day-name">Mar</div>
      <div class="p-day-name">Mer</div><div class="p-day-name">Gio</div><div class="p-day-name">Ven</div>
    </div>
    ${weeksHTML}
    <div class="print-totale">
      <div><div class="pt-label">Totale uscite ${MESI[currentMonth]}</div><div class="pt-value">${tataDays.length} giorni</div></div>
      <div style="text-align:right"><div class="pt-detail">Ritiro: 17:15</div><div class="pt-detail">Fine: 18:30</div></div>
    </div>`;

  window.print();
}

// ─── AUTH ───────────────────────────────────────────
let tokenClient;
window.onload = () => { render(); document.addEventListener('click',()=>{openDay=null;render();}); };

function signIn() {
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: (resp) => { if(resp.error){showToast('❌ Errore');return;} accessToken=resp.access_token; fetchUserInfo(); }
    });
  }
  tokenClient.requestAccessToken();
}

function fetchUserInfo() {
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:`Bearer ${accessToken}`}})
  .then(r=>r.json()).then(info=>{
    document.getElementById('authArea').innerHTML=`<div class="user-info"><img src="${info.picture}"/><span>${info.given_name}</span><button class="btn-logout" onclick="signOut()">Esci</button></div>`;
    const btn=document.getElementById('btnPublish'); btn.disabled=false; btn.textContent='📅 Pubblica su Google Calendar';
    showToast('✅ Accesso effettuato!');
  });
}

function signOut() {
  accessToken=null;
  document.getElementById('authArea').innerHTML=`<button class="btn-google" onclick="signIn()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" alt="G"/>Accedi con Google</button>`;
  const btn=document.getElementById('btnPublish'); btn.disabled=true; btn.textContent='🔒 Accedi per pubblicare';
}

// ─── PUBLISH ────────────────────────────────────────
async function publishToCalendar() {
  if (!accessToken){showToast('⚠️ Accedi prima');return;}
  const btn=document.getElementById('btnPublish');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Pubblicazione...';
  const workdays=getWorkdays(currentYear,currentMonth);
  let created=0,errors=0;
  for(const d of workdays){
    const key=dateKey(d); const mod=getMod(key); const ds=key;
    try{
      const isBovisio=mod.id.startsWith('bovisio');
      const sh=isBovisio?'07:00:00':'08:30:00'; const eh=isBovisio?'08:30:00':'17:30:00';
      let sum,desc,col;
      if(mod.id==='bovisio_nonno_tu'||mod.id==='bovisio_nonno_tata'){sum='🏥 Studio Bovisio – Nonno porta Samuel';desc='Nonno porta Samuel';col='2';}
      else if(mod.id==='bovisio_tu_tata'){sum='🏥 Bovisio – Tu porti Samuel';desc='Tu porti Samuel';col='4';}
      else if(mod.id==='monza_tu_tata'){sum='🏢 Monza – Tu porti Samuel';desc='Tu porti Samuel';col='7';}
      else{sum='🏢 Monza – Nonno porta Samuel';desc='Nonno porta Samuel';col='11';}
      await createEvent({summary:sum,description:desc,start:{dateTime:`${ds}T${sh}`,timeZone:'Europe/Rome'},end:{dateTime:`${ds}T${eh}`,timeZone:'Europe/Rome'},colorId:col,reminders:{useDefault:false,overrides:[{method:'popup',minutes:30}]}});
      if(mod.id==='bovisio_nonno_tu'){
        await createEvent({summary:'⏰ Prendi Samuel 17:15 – tu',description:'Tu vai a prendere Samuel alle 17:15',start:{dateTime:`${ds}T17:15:00`,timeZone:'Europe/Rome'},end:{dateTime:`${ds}T17:30:00`,timeZone:'Europe/Rome'},colorId:'2',reminders:{useDefault:false,overrides:[{method:'popup',minutes:15}]}});
      } else {
        await createEvent({summary:'👩 Tata Stefania con Samuel 17:15–18:30',description:'Tata Stefania prende Samuel alle 17:15\nFine: 18:30',start:{dateTime:`${ds}T17:15:00`,timeZone:'Europe/Rome'},end:{dateTime:`${ds}T18:30:00`,timeZone:'Europe/Rome'},colorId:'6',reminders:{useDefault:false,overrides:[{method:'popup',minutes:15}]}});
      }
      created++;
    }catch(e){errors++;}
  }
  btn.disabled=false;
  if(errors===0){btn.classList.add('success');btn.textContent=`✅ ${created*2} eventi pubblicati!`;showToast(`✅ ${MESI[currentMonth]} pubblicato!`);setTimeout(()=>{btn.classList.remove('success');btn.textContent='📅 Pubblica su Google Calendar';},4000);}
  else{btn.textContent=`⚠️ ${created} ok, ${errors} errori`;}
}

async function createEvent(body){
  const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{Authorization:`Bearer ${accessToken}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('error');
  return r.json();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
</script>
